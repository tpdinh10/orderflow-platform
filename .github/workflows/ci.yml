
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow_dev
          POSTGRES_DB: orderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://orderflow:orderflow_dev@localhost:5432/orderflow_test
      PYTHONPATH: ${{ github.workspace }}/backend
      JWT_SECRET_KEY: ci-only-fixed-test-secret-not-for-production-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest backend/tests -v

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
